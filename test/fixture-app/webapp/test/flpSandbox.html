<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launchpad sandbox (simulates SAP Build Work Zone)</title>
    <script>
      window["sap-ushell-config"] = {
        defaultRenderer: "fiori2",
        renderers: { fiori2: { componentData: { config: { search: "hidden", enableSearch: false } } } },
        applications: {
          // runs embedded in the launchpad window (for apps in an iframe see launchpadHost.html)
          "Books-display": {
            title: "Books",
            description: "embedded",
            applicationType: "SAPUI5",
            additionalInformation: "SAPUI5.Component=fixture.books",
            url: "../",
          },
        },
      };
    </script>
    <script src="https://ui5.sap.com/1.154.0/test-resources/sap/ushell/bootstrap/sandbox.js" id="sap-ushell-bootstrap"></script>
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/1.154.0/resources/sap-ui-core.js"
      data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resource-roots='{ "fixture.books": "../" }'
      data-sap-ui-compat-version="edge"
      data-sap-ui-async="true"
      data-sap-ui-frame-options="allow"
    ></script>
    <script>
      sap.ui.require(["sap/ui/core/Core"], function (Core) {
        Core.ready().then(function () {
          return sap.ushell.Container.createRenderer("fiori2", true);
        }).then(function (renderer) {
          renderer.placeAt("content");
        });
      });
    </script>
  </head>
  <body class="sapUiBody" id="content"></body>
</html>
